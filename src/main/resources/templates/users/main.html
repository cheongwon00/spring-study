<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메인</title>
</head>
<body>

<h1>로그인 성공</h1>

<p>메인 페이지입니다.</p>

<a href="/users/mypage">마이페이지</a>

<br><br>

<form action="/users/post" method="get">
    <button type="submit">게시글 생성</button>
</form>

<br>

<h2>게시글 목록</h2>

<table border="1">
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성자</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="post : ${posts}">
        <td th:text="${post.id}">1</td>

        <td>
            <a th:href="@{/users/post/{postId}(postId=${post.id})}"
               th:text="${post.title}">
                게시글 제목
            </a>
        </td>

        <td th:text="${post.user.username}">작성자</td>
    </tr>
    </tbody>
</table>

<br>

<form action="/auth/logout" method="post">
    <button type="submit">로그아웃</button>
</form>

</body>
</html>
