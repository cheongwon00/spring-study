<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>

<h1>회원가입</h1>

<div th:if="${errorMessage}">
    <p th:text="${errorMessage}"></p>
</div>

<form action="/users" method="post">

    <div>
        <label for="username">아이디</label>
        <input
                type="text"
                id="username"
                name="username"
                minlength="2"
                maxlength="20"
                required
        >
    </div>

    <br>

    <div>
        <label for="password">비밀번호</label>
        <input
                type="password"
                id="password"
                name="password"
                minlength="2"
                maxlength="20"
                required
        >
    </div>

    <br>

    <button type="submit">회원가입</button>

</form>

</body>
</html>
