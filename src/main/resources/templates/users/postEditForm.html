<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
</head>
<body>

<h1>게시글 수정</h1>

<form th:action="@{/users/post/{postId}(postId=${post.id})}" method="post">

    <input type="hidden" name="_method" value="PATCH">

    <div>
        <label for="title">제목</label>
        <input
                type="text"
                id="title"
                name="title"
                th:value="${post.title}"
                required
        >
    </div>

    <br>

    <div>
        <label for="content">내용</label>
        <textarea
                id="content"
                name="content"
                rows="10"
                cols="50"
                required
                th:text="${post.content}">
        </textarea>
    </div>

    <br>

    <button type="submit">수정 완료</button>

</form>

<br>

<a th:href="@{/users/post/{postId}(postId=${post.id})}">
    수정 취소
</a>

</body>
</html>
