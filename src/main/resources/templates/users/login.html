<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>

<h1>로그인</h1>

<div th:if="${errorMessage}">
    <p th:text="${errorMessage}"></p>
</div>

<form action="/auth/login" method="post">

    <div>
        <label for="name">아이디</label>
        <input
                type="text"
                id="name"
                name="name"
                placeholder="아이디를 입력하세요"
                required
        >
    </div>

    <br>

    <div>
        <label for="password">비밀번호</label>
        <input
                type="password"
                id="password"
                name="password"
                placeholder="비밀번호를 입력하세요"
                required
        >
    </div>

    <br>

    <button type="submit">로그인</button>

</form>

<br>

<a href="/users">회원가입</a>

</body>
</html>
